# Extended tests: heavy numerical campaigns, large problems, exotic element
# types and compilation-heavy suites. Manual or weekly, never required on PRs.
name: Extended tests
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Test group (extended, all, or a family: blas, lapack, sparse, graphs, spectral, tensors, api, generic, qa)'
        required: false
        default: 'extended'
  schedule:
    - cron: '0 3 * * 0'
permissions:
  contents: read
jobs:
  test:
    name: ${{ github.event.inputs.group || 'extended' }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: [ubuntu-latest, macos-latest]
        threads: ['1', '4']
    env:
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      OXIBLAS_TEST_GROUP: ${{ github.event.inputs.group || 'extended' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
